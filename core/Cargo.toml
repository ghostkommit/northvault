[package]
name = "northvault-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "northvault_core"
# staticlib -> linked into the macOS app via XCFramework
# cdylib    -> only used by uniffi-bindgen to read the interface metadata
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[features]
default = ["hardware"]
# USB hardware wallets (Coldcard, Jade, Ledger, Trezor). Off = air-gapped only.
hardware = ["dep:async-hwi", "dep:trezor-client", "dep:protobuf", "dep:rusb", "dep:ledger_bitcoin_client", "dep:ledger-transport-hidapi", "dep:ledger-apdu"]
# Test builds only: lets the Trezor and Ledger transports see local firmware emulators. Never in a release.
emulator = ["hardware"]

[dependencies]
northvault-descriptor = { path = "../descriptor-core" }
uniffi = { version = "0.28", features = ["cli", "tokio"] }
thiserror = "1"
bdk_wallet = { version = "3.2", features = ["rusqlite"] }
bdk_electrum = { version = "0.24", default-features = false, features = ["use-rustls-ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# trezor-client TRACE logs include outbound PIN protobufs. Compile them out.
tracing = { version = "0.1", features = ["max_level_info", "release_max_level_info"] }
ur = "0.5"
# Already in the tree through `ur`; used directly for crypto-account and crypto-output.
minicbor = { version = "2", features = ["alloc"] }
async-hwi = { version = "0.0.35", default-features = false, features = ["coldcard", "hidapi", "jade", "rustls"], optional = true }
trezor-client = { version = "0.1.6", default-features = false, features = ["bitcoin"], optional = true }
# Ledger's Bitcoin app client, used synchronously on the hardware worker thread.
ledger_bitcoin_client = { version = "0.6", default-features = false, features = ["paranoid_client"], optional = true }
ledger-transport-hidapi = { version = "0.10", optional = true }
ledger-apdu = { version = "0.10", optional = true }
# The Ledger HID transport logs every APDU (keys, PSBTs) at INFO. Compile `log` output above WARN out.
log = { version = "0.4", features = ["max_level_warn", "release_max_level_warn"] }
# Must match trezor-client's pinned protobuf version.
protobuf = { version = "=3.7.2", optional = true }
# Static libusb for Trezor, so the app doesn't need Homebrew's libusb.
rusb = { version = "0.9", features = ["vendored"], optional = true }

[dev-dependencies]
tempfile = "3"
bdk_wallet = { version = "3.2", features = ["rusqlite", "test-utils"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
