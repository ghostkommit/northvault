# Correctness-oriented linting. Purely stylistic and size rules that conflict
# with the existing compact house style are off, not "fixed" by churn.
included:
  - macos/Northvault
  - shared/Sources
  - shared/Tests
  - ios
  - scripts
disabled_rules:
  - line_length
  - identifier_name
  - colon
  - comma
  - statement_position
  - switch_case_alignment
  - large_tuple
  - function_body_length
  - cyclomatic_complexity
  - type_body_length
  - file_length
  - function_parameter_count
  - multiple_closures_with_trailing_closure
  - vertical_parameter_alignment
  - implicit_optional_initialization
  - opening_brace
  - control_statement
  - for_where
  - is_disjoint
  # Lossy UTF-8 decoding of OCR/tool output is deliberate.
  - optional_data_string_conversion
