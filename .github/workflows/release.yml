name: Release

# Pushing a tag such as v0.1.0 builds the app on a GitHub runner and publishes
# the zip and its SHA-256 as a GitHub release. The app is ad-hoc signed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag must match the app version
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' macos/LocalInfo.plist)"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match CFBundleShortVersionString $version in macos/LocalInfo.plist" >&2
            exit 1
          fi
      - run: make test
      - run: make build
      - run: make dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A re-pushed tag replaces its release instead of failing on the old one.
          gh release delete "$GITHUB_REF_NAME" --yes || true
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "Northvault $GITHUB_REF_NAME"
