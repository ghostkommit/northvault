name: northvault-regtest

x-service: &service
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: services
  image: northvault-regtest-services:local
  init: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  read_only: true
  tmpfs: ["/tmp:mode=1777"]

services:
  bitcoin:
    <<: *service
    networks: [regtest]
    volumes:
      - bitcoin-data:/data/bitcoin
    healthcheck:
      test: [CMD, python3, /opt/northvault/service.py, rpc-health]
      interval: 2s
      timeout: 10s
      retries: 60
      start_period: 10s
    stop_grace_period: 30s

  bootstrap:
    <<: *service
    network_mode: service:bitcoin
    command: [python3, /opt/northvault/service.py, bootstrap]
    volumes:
      - bitcoin-data:/data/bitcoin:ro
    depends_on:
      bitcoin:
        condition: service_healthy

  electrs:
    <<: *service
    network_mode: service:bitcoin
    command:
      - electrs
      - --network=regtest
      - --daemon-dir=/data/bitcoin
      - --db-dir=/data/electrs
      - --daemon-rpc-addr=127.0.0.1:18443
      - --daemon-p2p-addr=127.0.0.1:18444
      - --electrum-rpc-addr=127.0.0.1:50001
      - --monitoring-addr=127.0.0.1:4224
    volumes:
      - bitcoin-data:/data/bitcoin:ro
      - electrs-data:/data/electrs
    depends_on:
      bitcoin:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python3, /opt/northvault/service.py, electrum-health]
      interval: 2s
      timeout: 10s
      retries: 90
      start_period: 10s
    stop_grace_period: 30s

  tests: &test-runner
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: tests
    profiles: [test]
    init: true
    network_mode: service:bitcoin
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    volumes:
      - bitcoin-data:/data/bitcoin:ro
    depends_on:
      bitcoin:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
      electrs:
        condition: service_healthy

  coverage:
    <<: *test-runner
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: coverage
    profiles: [coverage]
    volumes:
      - bitcoin-data:/data/bitcoin:ro
      - ./build/coverage-rust:/reports

  # Trezor's own firmware emulator (Model T), headless. Test seed only; never a signer for funds.
  trezor:
    image: ghcr.io/trezor/trezor-user-env@sha256:7c9a57b23803fe6a9d7c8b20f2adcd125734745cdafd88dc2a311a4d012cf8c0
    profiles: [hardware]
    init: true
    network_mode: service:bitcoin
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:mode=1777"]
    # The image marks the binary executable for root only; root here holds no capabilities.
    environment:
      SDL_VIDEODRIVER: dummy
      TREZOR_PROFILE_DIR: /tmp
    # The binary name carries an architecture suffix.
    entrypoint: [sh, -c, "exec /trezor-user-env/src/binaries/firmware/bin/trezor-emu-core-T2T1-v2.13.1*"]
    healthcheck:
      # Only look for the bound port: the emulator replies to whoever sent the last
      # datagram, so a UDP ping from here would steal replies meant for the test.
      test: [CMD, grep, -q, ":534C ", /proc/net/udp]
      interval: 2s
      timeout: 5s
      retries: 30

  ledger:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: ledger-emulator
    profiles: [hardware]
    init: true
    network_mode: service:bitcoin
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:mode=1777"]
    # APDUs on 9999; the REST API on 5000 lets the test read the screen and press buttons.
    command: [--model, nanosp, --display, headless, --apdu-port, "9999", --api-port, "5000",
              --seed, "all all all all all all all all all all all all", /apps/btc-test.elf]
    healthcheck:
      # 9999 is 270F in /proc/net/tcp; 0A is LISTEN.
      test: [CMD, sh, -c, "grep -q ':270F .* 0A ' /proc/net/tcp"]
      interval: 2s
      timeout: 5s
      retries: 30

  hardware-tests:
    <<: *test-runner
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: hardware-tests
    profiles: [hardware]
    depends_on:
      bitcoin:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
      electrs:
        condition: service_healthy
      trezor:
        condition: service_healthy
      ledger:
        condition: service_healthy

networks:
  regtest:
    internal: true

volumes:
  bitcoin-data:
  electrs-data:
